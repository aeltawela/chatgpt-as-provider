<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">chatgpt-as-provider terminal consultation</title>
  <desc id="desc">A colorful terminal showing a temporary ChatGPT consultation about a judgmental TODO list.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1021"/>
      <stop offset="0.55" stop-color="#1b1640"/>
      <stop offset="1" stop-color="#081a2b"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b8a"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#4fd1c5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <style>
      .mono { }
      .small { font-size: 22px; }
      .body { font-size: 28px; }
      .answer { font-size: 30px; font-weight: 600; }
    </style>
  </defs>
  <rect width="1400" height="820" fill="url(#bg)"/>
  <circle cx="1250" cy="100" r="180" fill="#4fd1c5" opacity="0.08"/>
  <circle cx="150" cy="740" r="230" fill="#ff6b8a" opacity="0.08"/>
  <rect x="78" y="70" width="1244" height="680" rx="24" fill="#0b0d17" stroke="#3a3b5b" stroke-width="3" filter="url(#shadow)"/>
  <rect x="78" y="70" width="1244" height="76" rx="24" fill="#16182a"/>
  <rect x="78" y="122" width="1244" height="24" fill="#16182a"/>
  <circle cx="120" cy="108" r="12" fill="#ff6b8a"/>
  <circle cx="158" cy="108" r="12" fill="#f6c85f"/>
  <circle cx="196" cy="108" r="12" fill="#4fd1c5"/>
  <text x="700" y="116" text-anchor="middle" class="mono small" fill="#a4a7c4">chatgpt-as-provider  •  temporary consultation</text>
  <rect x="78" y="146" width="1244" height="5" fill="url(#bar)"/>
  <g font-family="Andale Mono">
  <text x="130" y="225" class="mono body" fill="#4fd1c5">$</text>
  <text x="170" y="225" class="mono body" fill="#f3f4ff">chatgpt-as-provider ask</text>
  <text x="130" y="285" class="mono body" fill="#a78bfa">›</text>
  <text x="170" y="285" class="mono body" fill="#f3f4ff">Why does my TODO list judge me?</text>
  <line x1="130" y1="325" x2="1270" y2="325" stroke="#2b2e49" stroke-width="2"/>
  <text x="130" y="382" class="mono small" fill="#f6c85f">✓ ChatGPT says</text>
  <text x="130" y="440" class="mono answer" fill="#ffffff">Because it has seen your “temporary” fix</text>
  <text x="130" y="485" class="mono answer" fill="#ffffff">live for 18 months.</text>
  <text x="130" y="550" class="mono small" fill="#7c82ad">model</text>
  <text x="245" y="550" class="mono small" fill="#4fd1c5">gpt-5.6-luna</text>
  <text x="510" y="550" class="mono small" fill="#7c82ad">reasoning</text>
  <text x="665" y="550" class="mono small" fill="#a78bfa">low</text>
  <text x="775" y="550" class="mono small" fill="#7c82ad">session</text>
  <text x="900" y="550" class="mono small" fill="#ff9fb3">temporary</text>
  <rect x="130" y="612" width="1140" height="2" fill="#2b2e49"/>
  <text x="130" y="675" class="mono small" fill="#7c82ad">OAuth ✓   store:false ✓   your agent stays in control ✓</text>
  <text x="130" y="710" class="mono small" fill="#555b83">No API key required for the documented ChatGPT OAuth flow.</text>
  </g>
</svg>
